name: Android camera bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "android-camera-bridge/**"
      - ".github/workflows/android-camera-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: android-camera-bridge
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-camera-bridge-debug
          path: android-camera-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
