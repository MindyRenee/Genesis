name: Restore autonomous learner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore autonomous learner from last known-good commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(cat python/genesis_cognitive/learning/autonomous.py)" != "PLACEHOLDER" ]; then
            echo "autonomous.py is already restored; nothing to do."
            exit 0
          fi
          git checkout 3251f2522dba53bf44d8951a567b25d2395fb1a3 -- python/genesis_cognitive/learning/autonomous.py
          git rm .github/workflows/restore-autonomous.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python/genesis_cognitive/learning/autonomous.py
          git commit -m "Restore autonomous learner after accidental placeholder"
          git push origin HEAD:main
