name: CI

on:
  # Validate every push and pull request.
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (v4l bindgen)
        # The v4l crate runs bindgen against <linux/videodev2.h> at
        # build time — needs libclang and the kernel V4L2 headers.
        # Mirrors the prerequisites in README.md.
        run: sudo apt-get update && sudo apt-get install -y libclang-dev linux-libc-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Smoke test daemon startup
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          log="$data_dir/daemon.log"
          pid=""
          trap 'if [[ -n "$pid" ]]; then kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi; rm -rf "$data_dir"' EXIT
          target/release/genesis-daemon --data-dir "$data_dir" >"$log" 2>&1 &
          pid=$!
          for _ in {1..100}; do
            if [[ -S "$data_dir/genesis.sock" ]]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; exit 1; fi
            sleep 0.1
          done
          if [[ ! -S "$data_dir/genesis.sock" ]]; then cat "$log"; echo "daemon did not publish its IPC socket"; exit 1; fi
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; echo "daemon exited after startup"; exit 1; fi
          kill -TERM "$pid"
          wait "$pid"
      - run: cargo test

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Oldest supported + current stable.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System deps (pycairo, v4l bindgen)
        # libcairo2-dev/pkg-config: the canvas.
        # libclang-dev/linux-libc-dev: the daemon build links v4l2-sys,
        # which runs bindgen against <linux/videodev2.h>. The python job
        # needs these because it builds genesis-daemon for the
        # end-to-end integration test — without it that test has no
        # binary and (previously) reported PASS while asserting nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config libclang-dev linux-libc-dev
      - name: Build daemon binary for the integration test
        run: cargo build --release
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('python/requirements*.txt') }}
      - run: pip install -r python/requirements-dev.txt
      - run: python3 -c "import nltk; nltk.download('wordnet', quiet=True); nltk.download('punkt_tab', quiet=True)"
      - run: ruff check
      - run: python3 -m pyflakes python/genesis_conscious/ python/genesis_client/ python/genesis_cli.py python/tests/ scripts/*.py
      - run: python3 -m mypy python/genesis_conscious/ python/genesis_client/ python/genesis_cli.py python/tests/ --ignore-missing-imports
      - run: python3 -m pytest python/tests/ -q -o addopts=''
