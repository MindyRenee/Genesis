name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (v4l bindgen)
        # The v4l crate runs bindgen against <linux/videodev2.h> at
        # build time — needs libclang and the kernel V4L2 headers.
        # Mirrors the prerequisites in README.md.
        run: sudo apt-get update && sudo apt-get install -y libclang-dev linux-libc-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System deps (pycairo)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('python/requirements*.txt') }}
      - run: pip install -r python/requirements-dev.txt
      - run: python3 -c "import nltk; nltk.download('wordnet', quiet=True); nltk.download('punkt_tab', quiet=True)"
      - run: ruff check
      - run: python3 -m pyflakes python/genesis_cognitive/ python/genesis_client/ python/genesis_cli.py python/tests/ scripts/*.py
      - run: python3 -m mypy python/genesis_cognitive/ python/genesis_client/ python/genesis_cli.py python/tests/ --ignore-missing-imports
      - run: python3 -m pytest python/tests/ -q -o addopts=''
