[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-cognitive"
version = "0.2.0"
requires-python = ">=3.12"
description = "Genesis — a machine-native cognitive architecture: Rust subconscious daemon plus Python conscious mind, no external model"
readme = "README.md"
authors = [{ name = "Mindy Beatty" }]
keywords = [
    "active-inference",
    "cognitive-architecture",
    "embodied-ai",
    "machine-learning",
    "neuromodulation",
]
license = { text = "AGPL-3.0-only, with Ethical Use restrictions (see LICENSE)" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Pinned mirrors of requirements.txt — update both together.
    "numpy==2.5.3",
    "nltk==3.10.3",
    "orjson==3.12.0",
    "psutil==7.2.2",
    "Pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "pycairo==1.29.1",
    "websockets==15.0.1",
]

[project.optional-dependencies]
# Voice/ambient-listening extras — the wheels bind system libraries
# (libportaudio, etc.), so they stay opt-in. Degrade-to-text is normal.
voice = [
    "vosk==0.3.45",
    "sounddevice==0.5.2",
    "speechrecognition==3.14.2",
]

[project.urls]
Repository = "https://github.com/MindyRenee/Genesis"
Issues = "https://github.com/MindyRenee/Genesis/issues"
Documentation = "https://github.com/MindyRenee/Genesis/tree/main/docs"
Changelog = "https://github.com/MindyRenee/Genesis/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.22817337"

[project.scripts]
genesis = "genesis_cli:_console_main"

[tool.setuptools]
py-modules = [
    "commitment",
    "discord_feed",
    "genesis_cli",
    "mind",
    "setup_embeddings",
]

[tool.setuptools.packages.find]
# Two package containers: the repository root (genesis_client,
# infrastructure, world, eval) and python/ (the brain-region tree).
where = [".", "python"]
namespaces = false
exclude = ["tests*", "python*", "voices*", "__pycache__*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "B", "BLE", "C4"]
# Project deliberately uses unicode typography (em-dashes, Greek letters) in
# docstrings and comments for math notation and prose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# prefrontal.py enters the self -> perception -> language -> self cycle, so the
# position of `infrastructure.narrative` relative to `self` decides
# whether `self` is fully bound when language/generator.py
# imports SelfModel from it. Sorting the block breaks every import in the
# package. The order is documented inline and guarded by test_import_order.py.
"python/frontal_lobe/prefrontal.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
