[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-cognitive"
version = "0.2.0"
requires-python = ">=3.12"
description = "Genesis — a machine-native cognitive architecture: Rust subconscious daemon plus Python conscious mind, no external model"
readme = "README.md"
authors = [{ name = "Mindy Beatty" }]
keywords = [
    "active-inference",
    "cognitive-architecture",
    "embodied-ai",
    "machine-learning",
    "neuromodulation",
]
license = { text = "n/a" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Mirrors requirements.txt — update both together. Versions float
    # free: bare names, no pins, no bounds, no lockfiles — see
    # CONTRIBUTING.md.
    "numpy",
    "nltk",
    "scipy",
    "orjson",
    "psutil",
    "Pillow",
    "opencv-python-headless",
    "pycairo",
    "websockets",
    # Runtime dep, not test-only: her tools invoke it via
    # ``sys.executable -m pytest`` (run_pytest, project creation,
    # proposal verification) — it must live in her environment.
    "pytest",
]

[project.optional-dependencies]
# Voice/ambient-listening extras — the wheels bind system libraries
# (libportaudio, etc.), so they stay opt-in. Degrade-to-text is normal.
# piper-tts ships the piper binary that install_optional_deps.sh links
# into Self_World/voices/piper; speech.py invokes it as a subprocess.
voice = [
    "vosk",
    "sounddevice",
    "speechrecognition",
    "piper-tts",
]
# Symbolic mathematics (parietal formal layer — symbolic_math tool).
# symbolic.py imports it lazily and degrades gracefully without it;
# the math tests skip when absent.
math = [
    "sympy",
    # Known break: mpmath>=1.4 removed names sympy still calls
    # (ctx_mp.bitcount, mpnumeric) — no bound per the rules.
    "mpmath",
]
# Virtual HID — her hand on the machine's input bus (tools/hid.py).
# evdev binds Linux uinput and publishes sdist-only, so installing it
# compiles a small C extension. The tools report unavailable without it.
hid = [
    "evdev; sys_platform == 'linux'",
]
[project.scripts]
genesis = "genesis_cli:_console_main"

[tool.setuptools.packages.find]
# The three worlds are the package containers: each is a sys.path
# root holding the packages that belong to it (Self_World — the
# self/organism (brain, chemicals, body), Inner_World — the
# cognition, Outer_World — the environment). Loose modules
# at a world's root (journal.py, discord.feed.py, mind.py, …) are
# reached through the launcher's PYTHONPATH, not pip metadata.
where = ["Self_World", "Inner_World", "Outer_World"]
namespaces = false
exclude = ["tests*", "python*", "voices*", "__pycache__*", "scripts*", "Language*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "B", "BLE", "C4"]
# Project deliberately uses unicode typography (em-dashes, Greek letters) in
# docstrings and comments for math notation and prose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# prefrontal.py enters the self -> perception -> language -> self cycle, so the
# position of `infrastructure.narrative` relative to `self` decides
# whether `self` is fully bound when language/generator.py
# imports SelfModel from it. Sorting the block breaks every import in the
# package. The order is documented inline and guarded by test_import_order.py.
"Self_World/frontal_lobe/prefrontal.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # sounddevice ≤0.5.6 sets ``data.shape = -1, channels`` inside its
    # CFFI audio callback — deprecated by NumPy 2.5 and not fixable
    # from here without vendoring the library. Scoped to that exact
    # message so every other deprecation still errors. Revisit on a
    # sounddevice release that drops the shape setter.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
