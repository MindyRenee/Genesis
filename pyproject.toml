[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-cognitive"
version = "0.2.0"
requires-python = ">=3.12"
description = "Genesis — a machine-native cognitive architecture: Rust subconscious daemon plus Python conscious mind, no external model"
readme = "README.md"
authors = [{ name = "Mindy Beatty" }]
keywords = [
    "active-inference",
    "cognitive-architecture",
    "embodied-ai",
    "machine-learning",
    "neuromodulation",
]
license = { text = "n/a" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Pinned mirrors of requirements.txt — update both together.
    "numpy==2.5.3",
    "nltk==3.10.4",
    "scipy==1.16.3",
    "orjson==3.12.0",
    "psutil==7.2.2",
    "Pillow==13.0.0",
    "opencv-python-headless==5.0.0.93",
    "pycairo==1.29.1",
    "websockets==15.0.1",
    # Runtime dep, not test-only: her tools invoke it via
    # ``sys.executable -m pytest`` (run_pytest, project creation,
    # proposal verification) — it must live in her environment.
    "pytest==9.1.1",
]

[project.optional-dependencies]
# Voice/ambient-listening extras — the wheels bind system libraries
# (libportaudio, etc.), so they stay opt-in. Degrade-to-text is normal.
# piper-tts ships the piper binary that install_optional_deps.sh links
# into python/voices/piper; speech.py invokes it as a subprocess.
voice = [
    "vosk==0.3.45",
    "sounddevice==0.5.6",
    "speechrecognition==3.14.2",
    "piper-tts==1.8.0",
]
# Symbolic mathematics (parietal formal layer — symbolic_math tool).
# symbolic.py imports it lazily and degrades gracefully without it;
# the math tests skip when absent.
math = [
    "sympy==1.12",
    # mpmath>=1.4 deprecated names sympy 1.12 still calls
    # (ctx_mp.bitcount, mpnumeric) — keep it below the break.
    "mpmath<1.4",
]
# Virtual HID — her hand on the machine's input bus (tools/hid.py).
# evdev binds Linux uinput and publishes sdist-only, so installing it
# compiles a small C extension. The tools report unavailable without it.
hid = [
    "evdev==2.0.0; sys_platform == 'linux'",
]
arc = [
    "arc-agi==0.9.9",
    "game-arena>=0.1.0",
    "kaggle>=2.2.5",
    "kaggle-environments>=1.33.3",
    "six>=1.17.0",
]

[project.scripts]
genesis = "genesis_cli:_console_main"

[tool.setuptools]
py-modules = [
    "commitment",
    "discord_feed",
    "genesis_cli",
    "mind",
    "setup_embeddings",
    "turn",
]

[tool.setuptools.packages.find]
# Two package containers: the repository root (genesis_client,
# infrastructure, eval) and python/ (the brain-region tree).
where = [".", "python"]
namespaces = false
exclude = ["tests*", "python*", "voices*", "__pycache__*", "scripts*"]

[tool.uv]
# kaggle-environments (arc extra) declares litellm>=1.86.1,<1.94.0, but
# litellm<1.100.4 carries open GHSA advisories. Nothing in the codebase
# imports litellm or kaggle_environments — the pin only rides the lock —
# so the declared cap is overridden to a patched release old enough to
# trust (1.109.x is <7 days out). filelock<=4.2.0 likewise carries
# advisory fixes; huggingface-hub and litellm leave it unpinned, and
# --upgrade-package will not move it across the 3.x/4.x line, so it is
# forced here (4.2.10 is <7 days out).
override-dependencies = ["litellm==1.108.0", "filelock==4.2.9"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "B", "BLE", "C4"]
# Project deliberately uses unicode typography (em-dashes, Greek letters) in
# docstrings and comments for math notation and prose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# prefrontal.py enters the self -> perception -> language -> self cycle, so the
# position of `infrastructure.narrative` relative to `self` decides
# whether `self` is fully bound when language/generator.py
# imports SelfModel from it. Sorting the block breaks every import in the
# package. The order is documented inline and guarded by test_import_order.py.
"python/frontal_lobe/prefrontal.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Block the system astropy plugin family that autoloads on this
# host — pytest_astropy pulls in astropy → erfa, which is compiled
# against NumPy 1.x and crashes the session under NumPy 2. None of
# them serve this suite; `-p no:` on an absent plugin is harmless
# on hosts that lack them.
addopts = "-q -p no:pytest_astropy -p no:pytest_astropy_header -p no:pytest_arraydiff -p no:pytest_doctestplus -p no:pytest_filter_subpackage -p no:pytest_remotedata"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # sounddevice ≤0.5.6 sets ``data.shape = -1, channels`` inside its
    # CFFI audio callback — deprecated by NumPy 2.5 and not fixable
    # from here without vendoring the library. Scoped to that exact
    # message so every other deprecation still errors. Revisit on a
    # sounddevice release that drops the shape setter.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
