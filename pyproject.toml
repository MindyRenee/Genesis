[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-cognitive"
version = "0.2.0"
requires-python = ">=3.12"
description = "Genesis — a machine-native cognitive architecture: Rust subconscious daemon plus Python conscious mind, no external model"
readme = "README.md"
authors = [{ name = "Mindy Beatty" }]
keywords = [
    "active-inference",
    "cognitive-architecture",
    "embodied-ai",
    "machine-learning",
    "neuromodulation",
]
license = { text = "Proprietary — all rights reserved (see LICENSE)" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Pinned mirrors of requirements.txt — update both together.
    "numpy==2.5.3",
    "nltk==3.10.3",
    "scipy==1.16.3",
    "orjson==3.12.0",
    "psutil==7.2.2",
    "Pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "pycairo==1.29.1",
    "websockets==15.0.1",
]

[project.optional-dependencies]
# Voice/ambient-listening extras — the wheels bind system libraries
# (libportaudio, etc.), so they stay opt-in. Degrade-to-text is normal.
# piper-tts ships the piper binary that install_optional_deps.sh links
# into python/voices/piper; speech.py invokes it as a subprocess.
voice = [
    "vosk==0.3.45",
    "sounddevice==0.5.2",
    "speechrecognition==3.14.2",
    "piper-tts==1.8.0",
]
# ARC game-play extras — the engine stack pulls in flask/matplotlib/
# pydantic, so it stays opt-in. arc.py imports it lazily and the ARC
# tests skip without it.
arc = [
    "arc-agi>=0.9.9",
    "arcengine>=0.9.3",
]
# Symbolic mathematics (parietal formal layer — symbolic_math tool).
# symbolic.py imports it lazily and degrades gracefully without it;
# the math tests skip when absent.
math = [
    "sympy==1.12",
    # mpmath>=1.4 deprecated names sympy 1.12 still calls
    # (ctx_mp.bitcount, mpnumeric) — keep it below the break.
    "mpmath<1.4",
]

[project.scripts]
genesis = "genesis_cli:_console_main"

[tool.setuptools]
py-modules = [
    "commitment",
    "discord_feed",
    "genesis_cli",
    "mind",
    "setup_embeddings",
]

[tool.setuptools.packages.find]
# Two package containers: the repository root (genesis_client,
# infrastructure, eval) and python/ (the brain-region tree).
where = [".", "python"]
namespaces = false
exclude = ["tests*", "python*", "voices*", "__pycache__*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "B", "BLE", "C4"]
# Project deliberately uses unicode typography (em-dashes, Greek letters) in
# docstrings and comments for math notation and prose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# prefrontal.py enters the self -> perception -> language -> self cycle, so the
# position of `infrastructure.narrative` relative to `self` decides
# whether `self` is fully bound when language/generator.py
# imports SelfModel from it. Sorting the block breaks every import in the
# package. The order is documented inline and guarded by test_import_order.py.
"python/frontal_lobe/prefrontal.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
