[project]
name = "genesis-cognitive"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "B", "BLE", "C4"]
# Project deliberately uses unicode typography (em-dashes, Greek letters) in
# docstrings and comments for math notation and prose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# engine.py enters the self -> perception -> language -> self cycle, so the
# position of `..infrastructure.narrative` relative to `..self` decides
# whether `genesis_cognitive.self` is fully bound when language/generator.py
# imports SelfModel from it. Sorting the block breaks every import in the
# package. The order is documented inline and guarded by test_import_order.py.
"genesis_cognitive/cognition/engine.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
