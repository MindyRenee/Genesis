[package]
name = "genesis"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Mindy Beatty"]
description = "A machine-native cognitive architecture with coupled neurochemical dynamics and active inference"
license-file = "LICENSE"

[package.metadata.genesis]
# Provenance marker — one letter of the creator lattice (see
# PROVENANCE.md).
marker-g13 = "0x47530D4953F3310A"

# binutils ≥2.44 warns "ignoring deprecated linker optimization setting '1'"
# about the -O1 rustc passes to the linker — a known upstream false
# positive (rust-lang/rust#158192). Allow the forwarding lint; linker
# errors still fail the build regardless.
[lints.rust]
linker_messages = "allow"

[dependencies]
flate2 = "1.1.9"
libc = "0.2.189"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
shared_memory = "0.12.4"
syn = { version = "3.0.3", features = ["full", "parsing", "printing", "visit"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
