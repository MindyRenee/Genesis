[package]
name = "genesis"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Mindy Beatty"]
description = "A New Discovery of Intelligence"
license-file = "n/a"

[package.metadata.genesis]
# Provenance marker — one letter of the creator lattice (see
# PROVENANCE.md).
marker-g13 = "0x47530D4953F3310A"

# The crate lives inside the self world: Self_World/src/ is the
# body's source tree (the daemon, neurochemistry, memory substrate).
[lib]
path = "Self_World/src/lib.rs"
# rlib for the daemon/binaries; cdylib so the same crate builds the
# `genesis_body` Python extension when the `python` feature is on.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "genesis-daemon"
path = "Self_World/src/bin/genesis-daemon.rs"

[[bin]]
name = "genesis-retina"
path = "Self_World/src/bin/genesis-retina.rs"

[[bin]]
name = "genesis-merge-ltm"
path = "Self_World/src/bin/genesis-merge-ltm.rs"

[[bin]]
name = "genesis-merge-stm"
path = "Self_World/src/bin/genesis-merge-stm.rs"

# Suppress linker deprecation warning for -O1 flag
[lints.rust]
linker_messages = "allow"

[features]
default = []
# Build the PyO3 extension module (cdylib artifact libgenesis.so,
# installed as genesis_body.so beside the interpreter).
python = ["dep:pyo3"]

# Versions float — "*" is cargo's bare-name form. No pins, no bounds,
# no lockfile (Cargo.lock is gitignored — see CONTRIBUTING.md).
[dependencies]
flate2 = "*"
pyo3 = { version = "*", optional = true, features = ["extension-module"] }
libc = "*"
proc-macro2 = { version = "*", features = ["span-locations"] }
quote = "*"
shared_memory = "*"
syn = { version = "*", features = ["full", "parsing", "printing", "visit"] }
v4l = "0.14"

[profile.release]
opt-level = 2
lto = "thin"
strip = "none"
codegen-units = 1
